<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04050d">
<meta name="robots" content="noindex,nofollow">
<title>ORION · ULTRA 1.2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2230%22 fill=%22%2307091a%22/%3E%3Ccircle cx=%2222%22 cy=%2232%22 r=%225%22 fill=%22%23ffc857%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%225%22 fill=%22%23ffc857%22/%3E%3Ccircle cx=%2242%22 cy=%2232%22 r=%225%22 fill=%22%23ffc857%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/orion/orion.css">
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"><i class="neb n1"></i><i class="neb n2"></i><div class="stars l1"></div><div class="stars l2"></div><div class="stars l3"></div><i class="shoot s1"></i><i class="shoot s2"></i></div>

<main class="wrap">
  <header class="hero">
    <svg class="const" viewBox="0 0 240 150" aria-hidden="true">
      <g class="cl" stroke="rgba(255,200,87,.28)" stroke-width="1" fill="none">
        <path d="M62 18 L96 52 L108 78 L88 124 M178 22 L152 56 L132 78 L150 126 M108 78 L120 76 L132 78 M96 52 L152 56"/>
      </g>
      <g class="cs">
        <circle cx="62" cy="18" r="3.2" style="--d:0s"/><circle cx="178" cy="22" r="2.6" style="--d:.8s"/>
        <circle cx="96" cy="52" r="2.4" style="--d:1.4s"/><circle cx="152" cy="56" r="2.4" style="--d:.3s"/>
        <circle class="belt" cx="108" cy="78" r="3.6" style="--d:.2s"/><circle class="belt" cx="120" cy="76.5" r="3.6" style="--d:.9s"/><circle class="belt" cx="132" cy="78" r="3.6" style="--d:1.6s"/>
        <circle cx="88" cy="124" r="3" style="--d:1.1s"/><circle cx="150" cy="126" r="3.8" style="--d:.5s"/>
      </g>
    </svg>
    <h1 class="logo" aria-label="ORION"><span>O</span><span>R</span><span>I</span><span>O</span><span>N</span></h1>
    <div class="sub"><i></i><b>ULTRA&nbsp;1.2</b><i></i></div>
  </header>

  <div class="cols">
    <div class="colA">
      <section class="card cap" id="cap" aria-live="polite">
        <div class="lbl">CAPITAL</div>
        <div class="big" id="eq">—</div>
        <div class="perf" id="perf"><span class="chip">—</span></div>
        <div class="spark" id="spark"></div>
      </section>

      <section class="pos" id="posWrap">
        <div class="shead"><h2>Positions ouvertes</h2><span class="cnt" id="posCnt"></span></div>
        <div class="plist" id="plist"></div>
        <div class="ptot" id="ptot"></div>
      </section>
    </div>

    <section class="scene" aria-label="Animation décorative de l'équipe ORION">
      <div class="stage" id="stage"></div>
    </section>
  </div>

  <footer class="foot">
    <span class="badge" id="badge">Paper trading · capital fictif</span>
    <span class="stale" id="stale" hidden></span>
    <a href="../v1-classic/">version classique</a>
  </footer>
</main>
<noscript><p class="ns">JavaScript est nécessaire pour afficher les données.</p></noscript>
<script src="../assets/orion/orion.js"></script>
</body>
</html>
